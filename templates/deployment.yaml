apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstapp
  labels:
    app: firstapp

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: firstapp

  template:
    metadata:
      labels:
        app: firstapp

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      tolerations:
        - key: dedicated
          operator: Equal
          value: firstapp
          effect: NoSchedule

      containers:
        - name: first
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8080
